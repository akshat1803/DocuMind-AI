name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documind_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/documind_test
      GEMINI_API_KEY: test-gemini-key
      JWT_ACCESS_SECRET: test-access-secret-that-is-long-enough
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-long-enough

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run project checks
        run: npm run check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind_test
          POSTGRES_DB: documind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://documind:documind_test@127.0.0.1:5432/documind_test
      DATABASE_URL: postgresql://documind:documind_test@127.0.0.1:5432/documind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:integration

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --profile app --profile test config --quiet
      - name: Build and start local stack
        run: docker compose --profile app up --build --wait --wait-timeout 180 web
      - name: Check SPA routing and API proxy
        run: |
          curl --fail --silent http://localhost:8080/chat/smoke | grep 'id="root"'
          curl --fail --silent http://localhost:8080/api/v1/health/ready
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs
      - name: Stop containers
        if: always()
        run: docker compose --profile app down --volumes
